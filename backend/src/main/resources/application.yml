server:
  port: 8081

spring:
  application:
    name: turismo-api
  datasource:
    # Por defecto apunta al Postgres mapeado en localhost:5433.
    # Para correr el backend en el contenedor Docker en la misma red del
    # compose, se sobreescribe con SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/turismo_app
    url: jdbc:postgresql://localhost:5433/turismo_app
    username: turismo
    password: turismo
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: America/Lima
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

turismo:
  security:
    issuers:
      - http://localhost:8080/realms/turismo
      - http://localhost:8080/realms/agencias-partners
    audience: turismo-api
    role-clients:
      - turismo-api
      - partners-integracion
    cors-origins:
      - http://localhost:4200
    public-paths:
      - /api/public/**
      - /actuator/health
      - /actuator/info
    rules:
      - { path: /api/reservas/mias,              methods: [GET], all-of: [ROLE_cliente] }
      - { path: /api/reservas,                   methods: [POST], all-of: [ROLE_cliente, SCOPE_reservas:write] }
      - { path: /api/agencia/reservas,           methods: [GET], all-of: [ROLE_agente] }
      - { path: /api/reservas/*/confirmar,       methods: [PUT], all-of: [ROLE_reservas.confirmar] }
      - { path: /api/admin/tours,                methods: [POST], all-of: [ROLE_tours.gestionar] }
      - { path: /api/admin/tours/*,              methods: [PUT],  all-of: [ROLE_tours.gestionar] }
      - { path: /api/pagos,                      methods: [POST], all-of: [ROLE_pagos.procesar, SCOPE_pagos:write] }
      - { path: /api/partners/**,                methods: [GET],  all-of: [ROLE_disponibilidad.consultar] }
      # /api/reservas/{id}             -> E5: @PostAuthorize en el metodo
      # /api/reservas/{id}/cancelar    -> E6: @PreAuthorize en el metodo
    authenticated-paths:
      - /api/**
    # Si el backend corre dentro de la red Docker del compose, override:
    #   KC_INTERNAL_BASE_URL=http://turismo-keycloak:8080
    # Spring Boot mapea var a turismo.security.kc-internal-base-url.
    kc-internal-base-url: ${KC_INTERNAL_BASE_URL:}

logging:
  level:
    org.hibernate.SQL: INFO
    pe.turismo.api: INFO
